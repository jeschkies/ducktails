[package]
name = "ducktails"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = "0.8.9"
# Matches Go's `humanize.ParseBytes`, which Loki's lexer uses — including the two
# edge cases the alternatives get wrong: `0.5B` truncates to 0, and `1e3KB` is an
# error rather than 1000000.
bytesize = "2"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
datafusion = "55.0.0"
datafusion-datasource = "55.0.0"
glob = "0.3.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
# Chosen over criterion for `AllocProfiler`: it reports allocation counts and
# bytes next to the timings, which is half of what these benchmarks are for.
divan = "0.1"
http-body-util = "0.1.5"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "query"
harness = false
